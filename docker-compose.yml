services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    volumes:
      - "./config/ha:/config"
    ports:
      - "8123:8123"
    restart: always

  mqtt:
    image: eclipse-mosquitto
    container_name: mqtt
    volumes:
       - "./config/mqtt:/mosquitto/config:rw"
    ports:
       - "1883:1883"
       - "9001:9001"
    restart: always

