- name: D16-1
  unique_id: D16-1
  platform: mqtt
  schema: template
  command_topic: "dimmer/c8ebd1524e1cfd3c071f5396/set"
  state_topic: "dimmer/c8ebd1524e1cfd3c071f5396/state"
  command_on_template: >
    {%- if brightness is defined -%}
    {"dimmer1":{"value":{{ (brightness / 255 * 99) | int }} 
    {%- else -%}
    {"dimmer1":{"value":99}}
    {%- endif -%}
  command_off_template: '{"dimmer1":{"value":0}}'
  state_template: >
    {%- if value_json.dimmer1.value == 0 -%}
      off
    {%- else -%}
      on
    {%- endif -%}
  brightness_template: >
    {%- if value_json.dimmer1.value is defined -%}
    {{ (value_json.dimmer1.value / 99 * 255) | int }}
    {%- else -%}
    0
    {%- endif -%}
    
